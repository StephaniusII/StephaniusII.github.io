<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Credits Page</title>
        <link rel="stylesheet" href="Styles.css">
        <script src="fanpointer/fan.js"></script>

        <style>
        @keyframes buttonAlert {
            0%   {background-color: rgb(255, 176, 184); border: 0.15em solid;}
            50%  {background-color: rgb(175, 30, 44); border: 0.35em solid;}
            100%   {background-color: rgb(255, 176, 184); border: 0.15em solid;}
        }
        
        @keyframes buttonHide {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        #unveilCredits{
            display: block;
            margin: 10px 0;
            color: #210e00;
            text-decoration: none;
            font-size: 18px;
            border: 1px solid #210e00;
            padding: 10px;
            border-radius: 5px;
        }

        #unveilCredits :hover {
            font-weight: 600;
            animation-name: linkHover;
            animation-duration: 0.3s;
            animation-fill-mode: forwards;
        }


        #nonsenseButton {
            border: 0.15em solid rgb(43, 0, 4);
            color: rgb(43, 0, 4);
            width: 100%;
            padding: 0.5em 0.6em;
            text-align: center;
            font-size: 1em;
            margin: 0.5em 0.25em;
            cursor: pointer;
            background-color: rgb(255, 176, 184);
            border-radius: 0.6em;
            animation-name: buttonAlert;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            flex-direction: column;
            align-items: center;
        }
        
        #nonsenseButton:hover {
            animation-name: none;
            animation-name: buttonHide;
            animation-duration: 0.2s;
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
        }


        #mouseModeButton{
            border: 0.15em solid #3e2b00;
            color: #3e2b00;
            width: 100%;
            padding: 0em;
            text-align: center;
            font-size: 1em;
            margin: 0.5em 0.25em;
            cursor: pointer;
            background-color: #e6a36166;
            border-radius: 0.6em;
            transition: all 0.2s;
            flex-direction: column;
            align-items: center;
        }

        #mouseModeButton:hover{
            border: 0.25em solid #3e2b00;
            transition: all 0.2s;
        }

        #hoverable{
            display: block;
            margin: 10px 0;
            color: #210e00;
            text-decoration: none;
            font-size: 18px;
            border: 1px solid #210e00;
            padding: 10px;
            border-radius: 5px;
        }

        #hoverable:hover {
            animation-name: linkHover;
            animation-duration: 0.3s;
            animation-fill-mode: forwards;
        }

        #addedElements a{
            display: block;
            margin: 10px 0;
            color: #210e00;
            text-decoration: none;
            font-size: 18px;
            border: 1px solid #210e00;
            padding: 10px;
            border-radius: 5px;
        }

        #addedElements a:hover {
            animation-name: linkHover;
            animation-duration: 0.3s;
            animation-fill-mode: forwards;
        }

        #addAmountInput{
            width: 80%;
        }

        #bToggleElements{
            border: 0.15em solid #003e2b;
            color: #003e2b;
            width: 100%;
            padding: 0.5em 0.6em;
            text-align: center;
            font-size: 1em;
            margin: 0.5em 0.25em;
            cursor: pointer;
            background-color: #61e6a366;
            border-radius: 0.6em;
            transition: all 0.2s;
            flex-direction: column;
            align-items: center;
        }



        .creditsContainer {
            visibility: collapse;
            display: none;
            height: 0em;
            opacity: 0;
            transition: height ease-in-out 1s 0.7s, opacity 0.7s, visibility 0s 1.7s;
        }

        .creditsContainer.displayed{
            display: block;
        }


        .creditsContainer.expanded {
            visibility: visible;
            opacity: 1;
            transition: height ease-in-out 1s, opacity 0.7s 1s;
        }

        .secretButton{
            position: fixed;
            top:0px;
            opacity: 0.8; 
        }

        .invisible{
            visibility:collapse;
            display: none;
        }

        </style>
        <script>        
            let counter = 0;
            function dontPushMyButtons() {
                counter++;
                switch (counter){
                    case 1: 
                        alert("I told you it's boring... Did you expect something to happen?");
                        break;
                    case 2:
                        alert("Pushing the boundaries, are we?");
                        break;
                    case 3:
                        alert("I am peace. I am serenity. I am balance. I am THE FORCE!")
                        break;
                    case 4:
                        alert("Did you know that the average human has less than 2 legs? \nYou could go google that instead of pushing my Buttons!")
                        break
                    case 5:
                        alert("Sure! you win! here is my hidden nonsense!");
                        toggleContainer("secretContainer");
                        break;
                    default:
                        alert("WHAT DO YOU WANT MORE!?")
                }
            }

            function toggleContainer(elementId){ 
                /*
                this whole code is simply for my fancursor. 
                the problem: when the credits container is collapsed, 
                the elements inside are still present and clickable with my fan cursor. so we need to set "display: none;"
                the "display: none" prevents any animations. so we need to time the display right to make the animations work
                */
                
                const container = document.getElementById(elementId);

                if (container.classList.contains("displayed")){
                    setTimeout(() => {
                        container.classList.remove("displayed");
                    }, 2000);

                    requestAnimationFrame(() => {
                        container.style.height="0px"
                        container.classList.remove("expanded");
                    });
                } else {
                    const nElements = container.children.length;
                    let height = nElements * 54 + 10;
                    container.classList.add("displayed");
                    requestAnimationFrame(() => {
                        container.style.height= height + "px";
                        container.classList.add("expanded");
                    });
                }

            }

            function toggleMouseMode(){ //toggles the fanpointer mouse mode
                toggleFan();
            }

            function toggleDebugging(){ // adds crosshair, vectors and Values to the Fanpointer Elements
                toggleDebugger();
                document.getElementById("debuggingView").classList.toggle("displayed");
            }

            function toggleElements(){
                const button = document.getElementById("bToggleElements");
                if (button.innerText === "Add Elements"){
                    const amount = parseInt(document.getElementById("addAmountInput").value);
                    addElements(amount);
                    button.innerText = "Remove Elements";
                } else {
                    removeElements();
                    button.innerText = "Add Elements";
                }
            }

            function addElements(amount){
                const hoverable = document.getElementById("dAddedElements");
                for (let i = 0; i < amount; i++){
                    const newElement = document.createElement("a");
                    newElement.id = "dynamicLink" + (i + Math.random()*1000).toFixed(0);
                    newElement.innerText = "Dynamic Link " + (i+1);
                    newElement.onclick = function() { console.log(newElement.id + " clicked"); };
                    hoverable.appendChild(newElement);
                }
                toggleContainer("dAddedElements");
            }
            function removeElements(){
                const hoverable = document.getElementById("dAddedElements");
                hoverable.innerHTML = "";
                toggleContainer("dAddedElements");
            }

        </script>
    </head>
